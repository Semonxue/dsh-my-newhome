<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="assets/whale.svg" type="image/svg+xml">
<title>DSH 自定义主页 · 布局原型</title>
<meta name="description" content="DeepSeek Harness 自定义主页的静态化交互原型：1x1 自由网格、右侧组件抽屉、可开合侧栏、深浅色主题。">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/composer.css">
<link rel="stylesheet" href="styles/widgets-plan.css">
<link rel="stylesheet" href="styles/widgets-padpc.css">
</head>
<body>
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><path d="M14 17h6M17 14v6"/></symbol>
  <symbol id="i-layout" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M10 9v11"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h10a5 5 0 0 1 0 10H8"/><path d="M8 5 4 9l4 4"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 9H10a5 5 0 0 0 0 10h6"/><path d="m16 5 4 4-4 4"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 4h4M6.5 7l.8 12a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9l.8-12M10 11v6M14 11v6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 18v2h16v-2"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M5.5 15a7.5 7.5 0 1 0 1.2-7.6L4 10"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l2 2.2h7.8A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5Z"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.9 9l5.6 1.9-5.6 2L12 18.5 10.1 13 4.5 11l5.6-2Z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18"/></symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M11 3.5 12.6 8l4.4 1.6-4.4 1.7L11 15.5 9.4 11.3 5 9.6 9.4 8Z"/><path d="M18 14.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9Z"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></symbol>
  <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m20 11.5-7.8 7.8a5 5 0 0 1-7-7l8-8a3.4 3.4 0 1 1 4.8 4.8l-8 8a1.8 1.8 0 0 1-2.5-2.6l7.2-7.2"/></symbol>
  <symbol id="i-drag" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.2" fill="currentColor" stroke="none"/></symbol>
</svg>

<div id="app" data-sidebar="open" data-drawer="open" data-grid="on">

  <!-- ── 模拟 DSH 左侧栏 ─────────────────────────────────────────── -->
  <aside id="sidebar" aria-label="DeepSeek Harness 侧栏">
    <div class="sidebar-inner">
      <div class="sb-brand">
        <span class="sb-logo" aria-hidden="true">
          <svg viewBox="0 0 50 50" fill="currentColor"><path d="M48.8354 10.0479C48.3232 9.79199 48.1025 10.2798 47.8032 10.5278C47.7007 10.6079 47.6143 10.7119 47.5273 10.8076C46.7793 11.624 45.9048 12.1597 44.7622 12.0957C43.0923 12 41.666 12.5356 40.4058 13.8398C40.1377 12.2319 39.2476 11.272 37.8926 10.6558C37.1836 10.3359 36.4668 10.0156 35.9702 9.31982C35.6235 8.82373 35.5293 8.27197 35.356 7.72754C35.2456 7.3999 35.1353 7.06396 34.7651 7.00781C34.3633 6.94385 34.2056 7.2876 34.0479 7.57568C33.418 8.75195 33.1733 10.0479 33.1973 11.3599C33.2524 14.312 34.4736 16.6641 36.8999 18.3359C37.1758 18.5278 37.2466 18.7197 37.1597 19C36.9946 19.5757 36.7974 20.1357 36.624 20.7119C36.5137 21.0801 36.3486 21.1597 35.9624 21C34.6309 20.4321 33.481 19.5918 32.4644 18.5757C30.7393 16.8721 29.1792 14.9917 27.2334 13.52C26.7764 13.1758 26.3193 12.856 25.8467 12.5518C23.8618 10.584 26.1069 8.96777 26.627 8.77588C27.1704 8.57568 26.8159 7.8877 25.0591 7.896C23.3022 7.90381 21.6953 8.50391 19.647 9.30371C19.3477 9.42383 19.0322 9.51172 18.7095 9.58398C16.8501 9.22363 14.9199 9.14355 12.9033 9.37598C9.10596 9.80762 6.07275 11.6396 3.84326 14.7681C1.16455 18.5278 0.53418 22.7998 1.30664 27.2559C2.11768 31.9521 4.46582 35.8398 8.07373 38.8799C11.8159 42.0322 16.1255 43.5762 21.041 43.2803C24.0269 43.104 27.3516 42.6963 31.1016 39.4561C32.0469 39.936 33.0396 40.1279 34.686 40.272C35.9546 40.3921 37.1758 40.208 38.1211 40.0078C39.6021 39.688 39.4995 38.2881 38.9639 38.0322C34.623 35.9678 35.5762 36.8081 34.71 36.1279C36.9155 33.4639 40.2402 30.6958 41.54 21.728C41.6426 21.0161 41.5557 20.5679 41.54 19.9917C41.5322 19.6396 41.6108 19.5039 42.0049 19.4639C43.0923 19.3359 44.1479 19.0317 45.1167 18.4878C47.9292 16.9199 49.064 14.3438 49.3315 11.2559C49.3711 10.7837 49.3237 10.2959 48.8354 10.0479ZM24.3262 37.8398C20.1196 34.4639 18.0791 33.3521 17.2358 33.3999C16.4482 33.4482 16.5898 34.3682 16.7632 34.9678C16.9443 35.5601 17.1812 35.9683 17.5117 36.4878C17.7402 36.832 17.8979 37.3442 1         </span>
        <span class="sb-brand-name">DeepSeek Harness</span>
        <button class="sb-collapse" id="sb-collapse" type="button" title="收起侧栏" aria-label="收起侧栏">
          <svg class="icon"><use href="#i-panel"/></svg>
        </button>
      </div>

      <button class="sb-new" type="button">
        <svg class="icon"><use href="#i-plus"/></svg><span>新会话</span>
      </button>

      <div class="sb-scroll">
        <div class="sb-sec">工作区</div>
        <button class="sb-item active" type="button"><span class="sb-dot" style="--dot:#4ade80">A</span><span class="sb-label">acme-web</span></button>
        <button class="sb-item" type="button"><span class="sb-dot" style="--dot:#22d3ee">D</span><span class="sb-label">data-lab</span></button>
        <button class="sb-item" type="button"><span class="sb-dot" style="--dot:#f59e0b">N</span><span class="sb-label">notes-app</span></button>
        <button class="sb-item" type="button"><span class="sb-dot" style="--dot:#a78bfa">V</span><span class="sb-label">video-pipeline</span></button>
        <button class="sb-item" type="button"><span class="sb-dot" style="--dot:#f472b6">C</span><span class="sb-label">content-ops</span></button>

        <div class="sb-sec sb-sec-gap">最近会话</div>
        <button class="sb-session" type="button"><svg class="icon"><use href="#i-spark"/></svg><span>自定义主页网格布局</span></button>
        <button class="sb-session" type="button"><svg class="icon"><use href="#i-spark"/></svg><span>API 用量卡片口径统一</span></button>
        <button class="sb-session" type="button"><svg class="icon"><use href="#i-spark"/></svg><span>侧栏 Logo 槽位调研</span></button>
      </div>

      <div class="sb-foot">
        <button class="sb-item" type="button"><svg class="icon"><use href="#i-settings"/></svg><span class="sb-label">设置</span></button>
        <button class="sb-user" type="button">
          <span class="sb-avatar">S</span>
          <span class="sb-user-main"><span class="sb-user-name">Semon</span><span class="sb-user-sub">DSH 桌面版</span></span>
          <svg class="icon sb-user-chev"><use href="#i-chevron"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── 主舞台 ──────────────────────────────────────────────────── -->
  <div id="workspace">
    <div id="stage">
      <div id="canvas-scroll">
        <div id="canvas">
          <div id="grid-overlay" aria-hidden="true"></div>
          <div id="widgets-layer"></div>
          <div id="drop-preview" hidden><span id="drop-preview-label"></span></div>
          <div id="canvas-pan-tail" aria-hidden="true"></div>
          <div id="empty-state" hidden>
            <div class="empty-glyph"><svg class="icon"><use href="#i-layout"/></svg></div>
            <div class="empty-title">画布还是空的</div>
            <div class="empty-desc">从右侧组件库拖入组件，或用预设开始</div>
            <button class="empty-btn" id="empty-classic" type="button">载入 DSH 经典布局</button>
          </div>
        </div>
      </div>

      <div id="prototype-badge">
        <span class="pb-dot"></span>
        <span class="pb-main">DSH 主页 · 布局原型</span>
        <span class="pb-sub">拖拽自由组合</span>
      </div>

      <div id="toolbar" role="toolbar" aria-label="原型控制">
        <button class="tb-btn" id="btn-sidebar" type="button" title="显示 / 隐藏 DSH 侧栏（S）" aria-label="显示或隐藏侧栏"><svg class="icon"><use href="#i-panel"/></svg></button>
        <button class="tb-btn" id="btn-theme" type="button" title="深色 / 浅色（T）" aria-label="切换主题"><svg class="icon"><use href="#i-moon"/></svg></button>
        <button class="tb-btn is-on" id="btn-grid" type="button" title="显示 / 隐藏网格（G）" aria-label="切换网格"><svg class="icon"><use href="#i-grid"/></svg></button>
        <span class="tb-sep"></span>
        <button class="tb-btn is-on" id="btn-drawer" type="button" title="组件库（D）" aria-label="切换组件库"><svg class="icon"><use href="#i-library"/></svg></button>
        <button class="tb-btn tb-wide" id="btn-preset" type="button" title="布局预设"><svg class="icon"><use href="#i-layout"/></svg><span id="preset-label">经典 DSH</span><svg class="icon tb-chev"><use href="#i-chevron"/></svg></button>
        <span class="tb-sep"></span>
        <button class="tb-btn" id="btn-undo" type="button" title="撤销（⌘Z）" aria-label="撤销" disabled><svg class="icon"><use href="#i-undo"/></svg></button>
        <button class="tb-btn" id="btn-redo" type="button" title="重做（⇧⌘Z）" aria-label="重做" disabled><svg class="icon"><use href="#i-redo"/></svg></button>
        <button class="tb-btn" id="btn-more" type="button" title="更多" aria-label="更多操作"><svg class="icon"><use href="#i-more"/></svg></button>
      </div>

      <div id="hintbar">
        <span><b>拖拽</b> 组件入画布</span><i></i>
        <span><b>拖动边角</b> 缩放</span><i></i>
        <span><b>Delete</b> 删除</span><i></i>
        <span><b>⌘Z</b> 撤销</span><i></i>
        <span id="pan-tip"><b>⇧+滚轮</b> / 双指滑动，查看浮层下的画布</span>
      </div>

      <div id="inspector" hidden>
        <div class="insp-main">
          <span class="insp-name" id="insp-name">组件</span>
          <span class="insp-size" id="insp-size">0 × 0</span>
        </div>
        <div class="insp-width" id="insp-width-row" hidden>
          <label for="insp-width">宽度</label>
          <input id="insp-width" type="range" min="10" max="22" step="1" value="16">
          <b id="insp-width-val">16 格</b>
        </div>
        <div class="insp-actions">
          <button class="insp-btn" id="insp-duplicate" type="button" title="复制（⌘D）"><svg class="icon"><use href="#i-copy"/></svg><span>复制</span></button>
          <button class="insp-btn danger" id="insp-delete" type="button" title="删除（Delete）"><svg class="icon"><use href="#i-trash"/></svg><span>删除</span></button>
        </div>
      </div>

      <div id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- ── 右侧组件抽屉 ────────────────────────────────────────────── -->
  <aside id="drawer" aria-label="组件库抽屉">
    <div class="drawer-inner">
      <header class="drawer-head">
        <div class="drawer-title">
          <svg class="icon"><use href="#i-library"/></svg>
          <span>组件库</span>
          <span class="drawer-count" id="palette-count">0</span>
        </div>
        <button class="drawer-close" id="drawer-close" type="button" title="收起组件库" aria-label="收起组件库"><svg class="icon"><use href="#i-x"/></svg></button>
      </header>
      <div class="drawer-search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="palette-search" type="search" placeholder="搜索组件…" autocomplete="off" spellcheck="false">
      </div>
      <div class="drawer-tabs" id="palette-tabs" role="tablist">
        <button class="pal-tab is-active" data-cat="all" role="tab" type="button">全部</button>
        <button class="pal-tab" data-cat="base" role="tab" type="button">基础</button>
        <button class="pal-tab" data-cat="plan" role="tab" type="button">现行规划</button>
        <button class="pal-tab" data-cat="pad" role="tab" type="button">Pad</button>
        <button class="pal-tab" data-cat="pc" role="tab" type="button">PC</button>
      </div>
      <div class="drawer-body" id="palette"></div>
      <footer class="drawer-foot">
        <span class="df-grip"><svg class="icon"><use href="#i-drag"/></svg></span>
        <span>浮层不占宽 · 左右滚动看画布</span>
        <span class="df-tip">演示数据</span>
      </footer>
    </div>
  </aside>
  <button id="drawer-tab" type="button" title="打开组件库" aria-label="打开组件库">
    <svg class="icon"><use href="#i-library"/></svg><span>组件库</span>
  </button>

  <!-- 浮动菜单 / 拖拽幽灵 -->
  <div class="menu" id="preset-menu" hidden></div>
  <div class="menu" id="more-menu" hidden></div>
  <div id="drag-ghost" hidden>
    <span class="dg-icon"><svg class="icon"><use href="#i-drag"/></svg></span>
    <span class="dg-name" id="dg-name">组件</span>
    <span class="dg-size" id="dg-size">0 × 0</span>
    <span class="dg-hint" id="dg-hint">拖到画布放置</span>
  </div>
</div>

<script src="js/widgets-plan.js"></script>
<script src="js/widgets-padpc.js"></script>
<script src="js/composer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
